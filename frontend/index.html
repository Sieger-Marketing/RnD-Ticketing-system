<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sieger Design Operations</title>
    <meta
      name="description"
      content="Sieger design operations: projects, design releases, tasks, capacity and delivery performance. Partnering Progress."
    />
    <!-- Signal Red, so the phone's browser chrome is on brand too. -->

    <!--
      Effra is the Sieger brand face but is licensed and not served by Google
      Fonts, so the approved web fallback pairing is used: Poppins for display
      and Sora for interface text.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
